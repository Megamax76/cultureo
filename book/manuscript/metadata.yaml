# Marketing
tagline: "Et si créer une app était aussi simple que d'avoir une idée ?"
elevator_pitch: |
  L'année 2025 marque une révolution : le "Vibe Coding" permet à n'importe qui de créer
  des logiciels en utilisant simplement le langage naturel. Plus besoin de maîtriser Python
  ou JavaScript - il suffit de savoir formuler une intention. Ce livre est le guide pour
  comprendre cette rupture technologique et en profiter dès maintenant.

back_cover_text: |
  Imaginez : vous avez une idée d'application. Quelques phrases plus tard, elle existe.

  Le "Vibe Coding" n'est pas de la science-fiction, c'est la réalité de 2025. Grâce aux
  modèles d'IA comme Claude et GPT-4, des comptables créent leurs propres outils, des
  entrepreneurs non-techniques lancent des startups, et la barrière entre l'imagination
  et l'exécution s'effondre.

  Dans ce livre, vous découvrirez comment cette révolution fonctionne, quels outils
  utiliser, comment devenir une "licorne unipersonnelle", et pourquoi cette compétence
  sera indispensable dans l'économie de demain.

  Rigoureux mais accessible, inspirant mais pragmatique, ce manifeste est votre passeport
  pour l'ère de la création sans limites.

